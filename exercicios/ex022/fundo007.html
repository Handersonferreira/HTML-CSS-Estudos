<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alimento vertical</title>
   <style>
    #container {
        background-image: url('img/target001.png');
        background-size: 100% 100%;
        position: relative;
        height: 96vh;
        padding: 10px;
        background-color: rgb(0, 111, 128);
    }

    #conteudo {
        background-image: url('img/target001.png');
        background-size: 100% 100%;
        position: absolute;
        height: 200px;
        width: 350px;
        background-color: rgba(244, 15, 15, 0.8);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
       
    }
   </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">
        </article>
    </section>
</body>
</html>
