<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table, td {
            width: 400px;
            border: 1px solid black;
            border-collapse: collapse;
        }
        td {
            padding: 10px;
        }

        td.sl1 {
            background-color: #7ce111;
        }

        td.sl2 {
            background-color: #e1cc11;
        }

        td.sl3 {
            background-color: #e11111;
        }

        tr.pl {
            background-color: #909999;
        }
</style>
</head>
<body>
    <h1> Minha Primeira Tabela</h1>

    <!--Hierarquia de Tabela (Simples) 

    table = tabela
    table row = linhas da tabela
    table data = dados da tabela
    table header = cabeçalho da tabela
     -->
    <table>
        
        <tr class="pl"><!-- primeira linha-->

            <td>A1</td>
            <td>B1</td> 
            <td>C1</td>

        </tr>

        <tr><!-- segunda linha-->

            <td class="sl1">A2</td>
            <td class="sl2">B2</td> 
            <td class="sl3">C2</td>

        </tr>

        <tr><!-- terceira linha-->

            <td>A3</td>
            <td>B3</td> 
            <td>C3</td>

        </tr>

        <tr><!-- quarta linha-->
            <td>A4</td>
            <td>B4</td> 
            <td>C4</td>

            <!-- ter hierarquia nas tags-->
        
        </tr>
    </table>
</body>
</html>
