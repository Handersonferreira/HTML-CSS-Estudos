<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelos de caixa</title>
    <style>
        h1 { /* box-level*/
            background-color: rgb(192, 220, 241);
            height: 67px;
            width: 249px;

            border: 4px solid rgb(73, 180, 229);

            padding: 10px;

            margin: 20px auto 122px auto;

            outline: 4px dashed rgb(73, 180, 229);

         }

        a { /* inline-level */

            border: 4px solid rgb(73, 180, 229);
        }

        div#bola {
            height: 100px;
            width: 100px;
            margin: 50px;
            background-color: black;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    
<h1>oi</h1>
    <h2>Exemplo de Caixa block-level</h2>
    <p>exempos de links<a href="#">Esse links </a>assim funciona</p>

    <div id="bola"></div>

</body>
</html>
